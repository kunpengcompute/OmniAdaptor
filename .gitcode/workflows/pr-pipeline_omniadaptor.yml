name: pr-pipeline_omniadaptor.yml

on:
  pull_request_target:
    types:
      - open
      - reopen
      - update
    branches:
      - '**'
  pull_request_comment:
    types:
      - created
    comments:
      - '^/compile$'
      - '^/rebuild$'
      - '^/retest$'
    branches:
      - '**'
env:
  pr_id: ${{ atomgit.event.pull_request.number }}
  target_branch: ${{ atomgit.event.pull_request.base.ref }}
  docker_img_openeuler2203: swr.cn-north-4.myhuaweicloud.com/cloud_boostkit/openeuler_22.03_lts_sp3:omniadaptor_arm_01
  docker_img_openeuler2403: swr.cn-north-4.myhuaweicloud.com/cloud_boostkit/openeuler_24.03_lts_sp3:omniadaptor_arm_01
  docker_img_centos7_9: swr.cn-north-4.myhuaweicloud.com/cloud_boostkit/centos7.9:omniadaptor_x86_01

defaults:
  run:
    shell: bash

concurrency: # 并发控制
  enable: true             # 启用并发控制
  max: 3                   # 最大并发运行数（范围1-5）：同一工作流最多3个运行同时执行
  exceed-action: QUEUE     # 超出并发上限的策略：QUEUE排队等待（另一选项IGNORE=直接忽略新触发）
  preemption:              # 抢占策略：新事件到来时取消同组正在运行的旧运行
    enable: true           # 启用抢占（默认true）
    events: [mr_id]        # 抢占粒度=按MR隔离：同一MR的新推送取消该MR的旧运行，不同MR互不影响

permissions:
  repository: read
  pr: read

stages: #阶段，不超过16个阶段，不超过256个job
  # stage0: # 流水线状态管理（非项目逻辑）—— 待下方 job 放开后再取消注释启用
  #   name: 初始化阶段
  #   select: selected_by_default
  #   jobs:
  #     associate_pr_comment:    # 阶段一暂注释，验证通过后放开
  #       name: associate_pr_comment
  #       runs-on: ["ubuntu-latest", "x64", "slim"]
  #       permissions:
  #         repository: read
  #         pr: write
  #       steps:
  #        - name: associate_pr_comment
  #          uses: associate-pr-comment
  #     init_pipeline_status:
  #       name: init_pipeline_status
  #       runs-on: ["ubuntu-latest", "x64", "slim"]
  #       steps:
  #         - name: Set running label
  #           uses: openlibing/pr-label-action@v1.0.0
  #           with:
  #             add_labels: ci_processing
  #             remove_labels: ci_successful,ci_failed
  #             token: ${{ atomgit.token }}

  stage1: # 校验阶段
    name: 校验阶段
    select: selected_by_default
    jobs:
      Detect_file_changes:
        name: Detect_file_changes
        runs-on: ["ubuntu-latest", "x64", "slim"]
        permissions:
          repository: read
          pr: read
        outputs:
          need_build_omnihelper: ${{ steps.set-skip.outputs.need_build_omnihelper }}
          need_build_omnistream: ${{ steps.set-skip.outputs.need_build_omnistream }}
        steps:
          - name: checkout
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              fetch-depth: 0
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: 'pull_request'
              base: ${{ env.target_branch }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.pr_id }}
              list-files: json
              predicate-quantifier: every
              filters: |
                changed:
                  - '**'
                doc-only:
                  - 'docs/**'
                  - '**/*.md'
                  - '**/*.rst'
                  - '**/*.log'
                  - '**/*.png'
                  - '**/*.jpg'
                  - '**/*.doc'
                  - '**/*.eddx'
                  - '**/*.svg'
          - name: Detect_change_dirs
            id: filter-dirs
            uses: paths-changes-filter
            with:
              event-name: 'pull_request'
              base: ${{ env.target_branch }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.pr_id }}
              list-files: json
              filters: |
                omnihelper:
                  - 'omnihelper/**'
                omnistream:
                  - 'omnistream/**'
                gitcode:
                  - '.gitcode/**'
          - name: set build skip flag
            id: set-skip
            run: |
              echo "changed: ${{ steps.filter.outputs.changed_files }}"
              echo "doc-only: ${{ steps.filter.outputs.doc-only }}"
              echo "omnihelper: ${{ steps.filter-dirs.outputs.omnihelper }}"
              echo "omnistream: ${{ steps.filter-dirs.outputs.omnistream }}"
              echo "gitcode: ${{ steps.filter-dirs.outputs.gitcode }}"
              if [ "${{ steps.filter.outputs.doc-only }}" = "true" ]; then
                echo "need_build_omnihelper=no" >> "$ATOMGIT_OUTPUT"
                echo "need_build_omnistream=no" >> "$ATOMGIT_OUTPUT"
              elif [ "${{ steps.filter-dirs.outputs.gitcode }}" = "true" ]; then
                echo "need_build_omnihelper=yes" >> "$ATOMGIT_OUTPUT"
                echo "need_build_omnistream=yes" >> "$ATOMGIT_OUTPUT"
              else
                echo "need_build_omnihelper=${{ steps.filter-dirs.outputs.omnihelper }}" >> "$ATOMGIT_OUTPUT"
                echo "need_build_omnistream=${{ steps.filter-dirs.outputs.omnistream }}" >> "$ATOMGIT_OUTPUT"
              fi
      sca-pr:
        name: sca-pr
        runs-on: ["ubuntu-latest", "x64", "slim"]
        permissions:
          id-token: write
          repository: read
        steps:
          - name: sca-pr
            uses: openlibing/sca-action/sca-pr-action@v1.0.0
            with:
              project-name: openEuler
      AntiPoison-scan:
        name: AntiPoison-scan
        runs-on: ["ubuntu-latest", "x64", "slim"]
        permissions:
          id-token: write
          repository: read
        steps:
          - name: malicious-scan
            uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
            with:
              project-name: openEuler
      pre-commit:
        runs-on: [self-hosted, openeuler, arm, cpu=4]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/cloud_boostkit/openeuler_24.03_lts_sp3:pre-commit_arm_01
        steps:
          - name: Checkout
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
          - name: install gitleaks
            run: |
              cd ${ATOMGIT_WORKSPACE}
              wget -q https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta-codecheck/gitleaks
              chmod +x gitleaks
              cd -
          - name: Run pre-commit
            uses: openlibing/pre-commit-action@v1.0.0
      build_openeuler2203_omniadaptor:
        name: build_openeuler2203
        if: ${{ jobs.Detect_file_changes.outputs.need_build_omnistream == 'yes' }}
        needs: [ Detect_file_changes ]      # 门控 outputs 引用必须保留（附录二第10条）
        uses: .gitcode/workflows/pr_build_omniadaptor.yml
        with:
          docker_img: "${{ env.docker_img_openeuler2203 }}"
          pr_id: "${{ env.pr_id }}"
          target_branch: "${{ env.target_branch }}"
          jdk_version: "17"
      build_openeuler2203_omnihelper_arm:
        name: build_omnihelper_openeuler2203
        if: ${{ jobs.Detect_file_changes.outputs.need_build_omnihelper == 'yes' }}
        needs: [ Detect_file_changes ]      # 门控 outputs 引用必须保留（附录二第10条）
        uses: .gitcode/workflows/pr_build_omnihelper.yml
        with:
          docker_img: "${{ env.docker_img_openeuler2203 }}"
          pr_id: "${{ env.pr_id }}"
          target_branch: "${{ env.target_branch }}"
          jdk_version: "8"
          arch: "arm"
      build_centos7_9_omnihelper_x86:
        name: build_omnihelper_centos7.9
        if: ${{ jobs.Detect_file_changes.outputs.need_build_omnihelper == 'yes' }}
        needs: [ Detect_file_changes ]      # 门控 outputs 引用必须保留（附录二第10条）
        uses: .gitcode/workflows/pr_build_omnihelper.yml
        with:
          docker_img: "${{ env.docker_img_centos7_9 }}"
          pr_id: "${{ env.pr_id }}"
          target_branch: "${{ env.target_branch }}"
          jdk_version: "8"
          arch: "x86"
